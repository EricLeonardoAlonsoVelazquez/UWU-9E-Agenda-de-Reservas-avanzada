<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Sistema de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles2_log.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="https://cdn-icons-png.flaticon.com/512/477/477103.png" alt="Logo" class="img-fluid">
                <h2>Recuperar Contraseña</h2>
                <p class="text-muted">Ingresa tu correo para recibir el enlace de recuperación</p>
            </div>
            
            <form id="recuperar-form">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                    <label for="email">Correo electrónico</label>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-login">Enviar enlace</button>
                </div>
                
                <div class="footer-links">
                    <a href="login.html" class="text-decoration-none">Volver al login</a>
                </div>
            </form>
            
            <div id="message" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="/js/firebaseInit.js"></script>
    <script src="js/forgot.js" defer></script>
</body>
</html>
