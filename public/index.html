<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Sistema de Reservas</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Crear Nueva Reserva</h5>
                    </div>
                    <div class="card-body">
                        <form id="reservaForm">
                            <div class="mb-3">
                                <label for="usuarioId" class="form-label">ID de Usuario</label>
                                <input type="text" class="form-control" id="usuarioId" required>
                            </div>
                            <div class="mb-3">
                                <label for="salaId" class="form-label">ID de Sala</label>
                                <input type="text" class="form-control" id="salaId" required>
                            </div>
                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label for="horaInicio" class="form-label">Hora Inicio</label>
                                    <input type="time" class="form-control" id="horaInicio" required>
                                </div>
                                <div class="col">
                                    <label for="horaFin" class="form-label">Hora Fin</label>
                                    <input type="time" class="form-control" id="horaFin" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3">Crear Reserva</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Verificar Disponibilidad</h5>
                    </div>
                    <div class="card-body">
                        <form id="disponibilidadForm">
                            <div class="mb-3">
                                <label for="dispSalaId" class="form-label">ID de Sala</label>
                                <input type="text" class="form-control" id="dispSalaId" required>
                            </div>
                            <div class="mb-3">
                                <label for="dispFecha" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="dispFecha" required>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label for="dispHoraInicio" class="form-label">Hora Inicio</label>
                                    <input type="time" class="form-control" id="dispHoraInicio" required>
                                </div>
                                <div class="col">
                                    <label for="dispHoraFin" class="form-label">Hora Fin</label>
                                    <input type="time" class="form-control" id="dispHoraFin" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success mt-3">Verificar</button>
                        </form>
                        <div id="disponibilidadResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5>Lista de Reservas</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Sala</th>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="reservasTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
