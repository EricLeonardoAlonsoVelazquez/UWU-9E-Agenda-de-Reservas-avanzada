<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-header img {
            width: 80px;
            margin-bottom: 1rem;
        }
        .btn-login {
            padding: 0.75rem;
            font-weight: 600;
        }
        .footer-links {
            text-align: center;
            margin-top: 1rem;
        }
        .form-control:invalid {
            border-color: #dc3545;
        }
        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.875em;
        }
        .was-validated .form-control:invalid ~ .invalid-feedback {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="https://cdn-icons-png.flaticon.com/512/477/477103.png" alt="Logo" class="img-fluid">
                <h2>Iniciar Sesión</h2>
                <p class="text-muted">Ingresa tus credenciales para acceder</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" 
                           placeholder="nombre@ejemplo.com" required>
                    <label for="email">Correo electrónico</label>
                    <div class="invalid-feedback">
                        Por favor ingresa un email válido (ejemplo: usuario@dominio.com)
                    </div>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" 
                           placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                    <div class="invalid-feedback">
                        Por favor ingresa tu contraseña
                    </div>
                </div>
                
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                        <span id="loginText">Iniciar Sesión</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </div>
                
                <div class="footer-links">
                    <a href="register.html" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
                </div>
            </form>
            
            <div id="message" class="mt-3 alert" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
