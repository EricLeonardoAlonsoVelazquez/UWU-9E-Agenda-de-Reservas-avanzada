<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles2_log.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="https://cdn-icons-png.flaticon.com/512/477/477103.png" alt="Logo" class="img-fluid">
                <h2>Crear Cuenta</h2>
                <p class="text-muted">Regístrate para acceder al sistema</p>
            </div>
            
            <form id="register-form">
                <div class="form-floating">
                    <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
                    <label for="nombre">Nombre completo</label>
                </div>
                
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                    <label for="email">Correo electrónico</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-login">Registrarse</button>
                </div>
                
                <div class="footer-links">
                    <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </form>
            
            <div id="message" class="mt-3"></div>
        </div>
    </div>

    <!-- En el head de tu HTML -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/js/firebaseInit.js"></script>
    <script type="module" src="js/register.js"></script>
</body>
</html>
